[package]
name = "setmeup"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Declarative machine provisioning — converge any fresh OS to your preferred environment."
license = "MIT"

[[bin]]
name = "setmeup"
path = "src/main.rs"

[workspace]
resolver = "2"

[dependencies]
age = "=0.12.1"
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "=0.29.0"
dirs = "=7.0.0"
keyring = "=4.2.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
thiserror = "=2.0.20"
ureq = "=3.4.1"
zeroize = "=1.9.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"