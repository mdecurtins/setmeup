name: CI

# Enforcement, not decoration. Each job maps to a contract clause:
#   fmt/clippy/test        -> "What done means" quality gate (dev-workflow)
#   coverage               -> dev-governance quality-gates: focused lib floor
#   deps                   -> dev-governance quality-gates: cargo deny (advisories/licenses/sources)
#   shell                  -> dev-governance quality-gates: shellcheck + shfmt
#   secrets                -> "Trust boundary" secret scan (public repo)
# Cargo-gated steps skip until the setmeup-core crate exists, so CI stays green
# during scaffold-only phases and enforces fully once product code lands.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Enforce formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check

      - name: Enforce lint (warnings denied)
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test suite
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --all-features

      - name: Verify toolchain pin is active
        run: |
          rustc --version
          test -f rust-toolchain.toml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain with llvm-tools
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@4005ba9a372944291571d98926b7bf5016bf6c56 # cargo-llvm-cov

      - name: Collect coverage
        if: hashFiles('Cargo.toml') != ''
        run: cargo llvm-cov --all-features --json --output-path coverage.json

      - name: Gate core modules (per-module floors, not whole crate)
        if: hashFiles('Cargo.toml') != ''
        run: python3 .github/scripts/check-core-coverage.py coverage.json

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-deny
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@f1dd293276342cf06b423f44b1c7c9312a2d2ecb # cargo-deny

      - name: Run cargo deny (advisories, licenses, sources)
        if: hashFiles('Cargo.toml') != ''
        run: cargo deny check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Find shell scripts
        id: find-shell
        run: |
          FILES=$(find . -type f -name '*.sh' -not -path './.git/*' -not -path './.opencode/node_modules/*' || true)
          echo "FILES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run shellcheck
        run: |
          if [ -z "${{ steps.find-shell.outputs.FILES }}" ]; then
            echo "No shell scripts found; nothing to lint."
            exit 0
          fi
          printf '%s\n' "${{ steps.find-shell.outputs.FILES }}" | xargs shellcheck

      - name: Run shfmt check (formatting diff)
        run: |
          if [ -z "${{ steps.find-shell.outputs.FILES }}" ]; then
            echo "No shell scripts found; nothing to format-check."
            exit 0
          fi
          printf '%s\n' "${{ steps.find-shell.outputs.FILES }}" | xargs shfmt -d

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks/setmeup.toml
        # Fail closed: any secret-like pattern in tracked content blocks the change.
        # Legitimate false positives are allowlisted in .gitleaks/setmeup.toml (reviewed).
