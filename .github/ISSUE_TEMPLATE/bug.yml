name: Bug report
description: Report a bug in setmeup
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A bug that touches secrets, keys, or credentials
        is a **security** issue — mark the scope checkbox below so it is triaged as such.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken? Be specific and concise.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we trigger the bug?
      placeholder: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens? Include exit codes, error output, traces.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Environment
      description: OS / distro (e.g. Ubuntu 24.04 on WSL2, macOS 15, Windows 11)
      placeholder: Ubuntu 24.04 on WSL2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: setmeup version
      description: Output of `setmeup --version`
  - type: checkboxes
    id: security
    attributes:
      label: Scope
      options:
        - label: Touches the trust boundary (secrets, keys, credentials) — triage as `security`
  - type: textarea
    id: related
    attributes:
      label: Related OpenSpec change / issue
      description: Link any existing change or PR this bug maps to.