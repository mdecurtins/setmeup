# cargo-deny configuration - dependency governance for setmeup
# Primary gate per dev-governance (quality-gates). Fail-closed on advisories,
# disallowed licenses, and unvetted sources. Allowlists are reviewed, not bypasses.

[advisories]
# cargo-deny 0.20: vulnerability/unsound/notice advisories always error (no config);
# yanked uses deny/warn/allow; unmaintained uses all/workspace/transitive/none scope.
unmaintained = "all"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]